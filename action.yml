name: WordPress Plugin Readme Validator
description: Validate WordPress plugin headers against readme.txt metadata.
author: Asllan Maciel
branding:
  icon: check-circle
  color: blue
inputs:
  plugin-file:
    description: Path to the main plugin PHP file.
    required: true
  readme-file:
    description: Path to readme.txt.
    required: false
    default: readme.txt
runs:
  using: composite
  steps:
    - name: Validate plugin metadata
      shell: bash
      env:
        WP_README_VALIDATOR_ACTION_PATH: ${{ github.action_path }}
        WP_README_VALIDATOR_PLUGIN_FILE: ${{ inputs.plugin-file }}
        WP_README_VALIDATOR_README_FILE: ${{ inputs.readme-file }}
      run: php "$WP_README_VALIDATOR_ACTION_PATH/bin/wp-readme-validator" --plugin="$WP_README_VALIDATOR_PLUGIN_FILE" --readme="$WP_README_VALIDATOR_README_FILE"
